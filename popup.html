<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini Notebook Companion</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="brand">
    <img src="icons/icon-48.png" alt="" width="38" height="38">
    <div><h1>Notebook<span class="dot">.</span></h1><p>Less switching.</p></div>
    <span class="brand-label">COMPANION</span>
  </header>
  <main>
    <section class="notebook-card" aria-labelledby="notebook-label">
      <div class="section-heading"><label id="notebook-label" for="notebook-url">Your notebook</label><button id="use-tab" class="text-button" type="button">Use current tab ↗</button></div>
      <form id="notebook-form">
        <div class="input-row"><input id="notebook-url" type="url" required spellcheck="false" autocomplete="off" placeholder="Paste a notebook link" aria-describedby="notebook-hint"><button type="submit" class="small">Save</button></div>
      </form>
      <p id="notebook-hint">NotebookLM &amp; Gemini Notebook</p>
    </section>
    <section class="mode-grid" aria-label="Open notebook">
      <button id="sidebar" class="mode-card primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span>Sidebar</span><kbd id="sidebar-key">—</kbd></button>
      <button id="popout" class="mode-card" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7m0-7-9 9M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>Floating window</span><kbd id="popout-key">—</kbd></button>
    </section>
    <button id="floating" class="launcher-action" type="button"><span class="launcher-symbol" aria-hidden="true">＋</span><span>Floating button on this page</span><span aria-hidden="true">↗</span></button>
    <section class="preferences" aria-label="Preferences">
      <label class="check"><input id="compact" type="checkbox"><span class="setting-name">Chat only</span></label>
      <label class="theme-label" for="theme"><span>Theme</span><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer><span>Independent companion for Notebook</span><span class="local-note">● On-device settings</span></footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
