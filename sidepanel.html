<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Companion</title><link rel="stylesheet" href="ui.css"></head>
<body class="panel">
<header class="companion-header"><div class="identity"><img src="icons/icon-32.png" alt="" width="28" height="28"><div><h1>Notebook</h1><span class="view-label">SIDEBAR</span></div></div><button id="popout" class="icon-button" title="Open floating window" aria-label="Open floating window">↗</button></header>
<div class="panel-tools"><label class="view-toggle"><input type="checkbox" id="compact"><span>Chat only</span></label><button id="reload" class="text-button" title="Open the notebook link saved in the toolbar popup">Load saved notebook ↻</button></div>
<main id="welcome"><div class="empty-symbol" aria-hidden="true">▤</div><h2>Your notebook, beside you.</h2><p>Open a saved notebook here, or sign in using a regular tab.</p><button class="primary" id="enable">Open notebook</button><button id="signin">Open in browser ↗</button><details class="embed-note"><summary>About sidebar access</summary><p>Chrome embedding removes this site's frame and CSP headers inside the companion. If Google blocks sign-in here, use the floating window.</p></details></main>
<div id="frame-container" hidden><iframe id="notebook" title="Notebook chat" allow="clipboard-write"></iframe></div>
<div class="panel-bottom"><p id="status" role="status" aria-live="polite"></p><button id="fallback" hidden>Open floating window ↗</button><button id="disable" class="text-button" hidden>Disconnect sidebar</button><span class="footer-links"><a class="footer-icon" href="https://www.anisharyal09.com.np/support?from=notebook-companion" target="_blank" rel="noopener noreferrer" aria-label="Support me" title="Support me <3 🤭">♥</a><a class="version-label" href="https://github.com/anisharyal09/gemini-notebook-companion" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub" title="View source on GitHub">v1.1.1</a></span></div>
<script src="shared.js"></script><script src="sidepanel.js"></script></body></html>
